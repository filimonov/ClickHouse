(function () {
  var m = new URLSearchParams(location.search).get('measurement');
  if (!m) {
    SCC.ui.mount(document, SCC.contract.load(JSON.parse(document.getElementById('contract').textContent)));

  }
  fetch(m).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);

    SCC.ui.renderDrill(document.getElementById('drill'), j);
