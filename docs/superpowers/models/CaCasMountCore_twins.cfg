\* POSITIVE gate with two incarnations of uuid A, recovery-generation layer off. Bounds of `_stage1`
\* with `Actors = {A}` and `MaxClock = 3`: at `MaxClock = 4` the search takes 23 min with one worker.
\* `GlobalSupersededWriterMakesNoMutation` is not listed: it reads the durable counter, and with two
\* incarnations a start that allocates and then fails advances the counter without superseding anyone
\* (see the 2026-10-08 section of `CaCasMountCore_RESULTS.md`). `FenceCostsEpoch` and
\* `WriterEpochMonotoneUnique` stay out for the reason `_stage1` gives. `StrictOrderMount` prunes the
\* epoch-0 bootstrap mount, which both incarnations would hold at epoch 0; `NoEpochWipe` prunes
\* epoch-object loss, the documented same-pair twin residual.
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 3
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
    ImmutableAlloc = FALSE
    SabReacquireRedecides = FALSE
    ImmutableClaim = FALSE
    Reserve = 0
    SabClaimDeadlineAtConfirm = FALSE
    SabOpenWithoutReserve = FALSE
    SabClaimResolveByPair = FALSE
    TwoStepAbsence = FALSE
    ProxyMay404 = FALSE
    SabAbsenceGetOnly = FALSE
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT NoPermanentWedge
INVARIANT ClaimNeverRegressesEpoch
INVARIANT OneWritableIncarnationPerUuid
