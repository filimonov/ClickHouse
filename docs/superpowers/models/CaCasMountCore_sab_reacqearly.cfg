\* SABOTAGE on the straggler wrapper: a renewal read and an allocation may overlap a running reacquire.
\* Expected: `NoStragglerInReacquire` violated. Runs `CaCasMountCoreStraggler.tla`. Two incarnations of one
\* uuid, `TTL = 1`, `Reserve = 0`, `MaxClock = 2`, `MaxEpoch = 3`, `MaxToken = 6`, `CertReacquire` and
\* `FarewellOn` on (immutable allocation and claim as `_twins_immclaim`).
SPECIFICATION SpecW
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 3
    MaxToken = 6
    TTL = 1
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
