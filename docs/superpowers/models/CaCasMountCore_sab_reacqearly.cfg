    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
    ImmutableAlloc = TRUE
    SabReacquireRedecides = FALSE
    ImmutableClaim = TRUE
    Reserve = 0
    SabClaimDeadlineAtConfirm = FALSE
    SabOpenWithoutReserve = FALSE
    SabClaimResolveByPair = FALSE
    TwoStepAbsence = FALSE
    ProxyMay404 = FALSE
    SabAbsenceGetOnly = FALSE
    CertReacquire = TRUE
