\* Sabotage: a renewal arms the fence while a remount request is pending
\* => MUST VIOLATE NoArmWhileRequestPending.
\* LossStops = FALSE: the race needs an interference report that requests a
\* remount, which only the product before Stopping makes.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = FALSE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = FALSE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  ReacquireInThread = FALSE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
  DrainWaitsPublish = TRUE
  FarewellLeaseBound = FALSE
  SabFarewellFromTerminal = FALSE
INVARIANT TypeOK
PROPERTY NoArmWhileRequestPending
CHECK_DEADLOCK FALSE
