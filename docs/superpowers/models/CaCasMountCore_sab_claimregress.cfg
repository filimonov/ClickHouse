\* SABOTAGE (lower epoch): a delayed start installs its older epoch over a newer terminal body of its own uuid.
\* Uuid A has two incarnations. One allocates an epoch and stalls; the other allocates the next one,
\* claims, and is fenced by GC; the first resumes and reclaims the fenced body with its older epoch.
\* `SabClaimNonMonotone = TRUE` drops `ClaimMount`'s `monotoneOK`, which is `claimMount` today.
\* Expected: `ClaimNeverRegressesEpoch` violated. Bounds and constraints as `_twins`.
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 3
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = TRUE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT ClaimNeverRegressesEpoch
