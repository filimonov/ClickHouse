\* POSITIVE gate, `_twins_immalloc` with the claim as one immutable conditional write
\* (`ImmutableClaim = TRUE`, `Reserve = 1`): the deadline is fixed before the body is built, an unclear
\* write is confirmed by our exact write, and writes open only with a reserve left. Expected: green.
\* Reduced bounds (MaxClock 2, MaxEpoch 2, MaxToken 5): the full bounds of `_twins` do not converge.
