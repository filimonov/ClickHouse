\* Sabotage: a reclaim arms the fence although a request was raised after its
\* snapshot => MUST VIOLATE NoArmWhileRequestPending.
\* LossStops = FALSE: the race needs an interference report that requests a
\* remount, which only the product before Stopping makes.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = FALSE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = FALSE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  MaxGen = 2
INVARIANT TypeOK
PROPERTY NoArmWhileRequestPending
CHECK_DEADLOCK FALSE
