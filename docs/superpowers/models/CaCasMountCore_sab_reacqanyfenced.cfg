\* SABOTAGE: a reacquire also replaces any fenced body of its uuid, not only the one it read. Expected:
\* `ReacquireTakesOnlyItsOwnFence` violated. Two incarnations of one uuid, `TTL = 1`, `Reserve = 0`,
\* `MaxClock = 2`, `MaxEpoch = 3`, `MaxToken = 6`, `CertReacquire` and `FarewellOn` on (immutable
\* allocation and claim as `_twins_immclaim`).
\* `FenceCostsEpoch` stays out for the reason `_twins` gives: a delayed start's create-if-absent can land a
\* live body at a fenced epoch after `ClearExpiredMount`, with no reacquire involved.
