\* POSITIVE gate with two incarnations of uuid A and the recovery-generation layer on. Bounds of
\* `_v9_recoverygen` with `Actors = {A}`. Invariants and constraints as `_twins`, plus
\* `AckedOpsAreDurable`. `MaxAdmissions = 2`: at 3 the search passed 30 M distinct states in 20 min with
\* the queue still near 9 M.
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 2
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT NoPermanentWedge
INVARIANT ClaimNeverRegressesEpoch
INVARIANT OneWritableIncarnationPerUuid
INVARIANT AckedOpsAreDurable
