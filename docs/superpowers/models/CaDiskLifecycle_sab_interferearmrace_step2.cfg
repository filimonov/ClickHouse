\* Sabotage: the reclaim opens writes on its earlier decision; an interference
\* report between the decision and the open loses => MUST VIOLATE TerminalAbsorbing.
\* The same sabotage on the reacquire in the lease thread (`ReacquireInThread`); the route must be red on the
\* same property.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = TRUE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = FALSE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  ReacquireInThread = TRUE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
  DrainWaitsPublish = TRUE
  FarewellLeaseBound = FALSE
  SabFarewellFromTerminal = FALSE
INVARIANT TypeOK
PROPERTY TerminalAbsorbing
CHECK_DEADLOCK FALSE
