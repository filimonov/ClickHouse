\* POSITIVE gate for the certificate reacquire. A renewal that reads its own fenced body keeps the token;
\* the reacquire claim replaces only that body, repeats unchanged on an unclear answer, and stops on any
\* other slot state. A twin may release its body as a clean marker (`FarewellOn`). Expected: green.
\* Two incarnations of one uuid, `TTL = 1`, `Reserve = 0`, `MaxClock = 2`, `MaxEpoch = 3`, `MaxToken = 6`,
\* `CertReacquire` and `FarewellOn` on (immutable allocation and claim as `_twins_immclaim`).
\* `VIEW` drops seven variables nothing here reads (see `ViewNoHistory` in the module).
\* `FenceCostsEpoch` stays out for the reason `_twins` gives: a delayed start's create-if-absent can land a
\* live body at a fenced epoch after `ClearExpiredMount`, with no reacquire involved.
