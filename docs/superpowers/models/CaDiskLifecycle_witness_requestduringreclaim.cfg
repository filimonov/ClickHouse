\* Witness: a remount request is raised while a reclaim runs
\* (violation = good).
\* LossStops = FALSE: the race needs an interference report that requests a
\* remount, which only the product before Stopping makes.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = FALSE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  ReacquireInThread = FALSE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
INVARIANT WNoRequestDuringReclaim
CHECK_DEADLOCK FALSE
