\* SABOTAGE fix A: compare the slot body's (uuid, epoch) instead of the ETag.  Only a same-pair
\* twin (pre-#2512) defeats it.  TLC MUST violate ConfirmedRelinkNeverDangles.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
    ZombieBelief = TRUE
    AllowTwin = TRUE
    ConfirmFix = "A"
    MaxRenew = 1
    SabotageSlotCache = FALSE
    SabotageHolderOnly = TRUE
    SabotageRenewBeforeCheck = FALSE
INVARIANTS
    TypeOK
    GraduationIsPhased
    ConfirmedRelinkNeverDangles
    PromotedNeverDangles
CHECK_DEADLOCK FALSE
