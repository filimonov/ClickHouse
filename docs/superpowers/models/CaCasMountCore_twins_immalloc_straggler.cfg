\* POSITIVE gate, `_twins_immalloc` with a straggler: a renewal write already sent when the allocation
\* starts can land after it (`StragglerAdopt = TRUE`), and the process's mount fence is latched lost from
\* `AllocBegin` until its next claim, so `Write` is disabled meanwhile. Expected: green. Bounds and
\* constraints as `_twins`.
