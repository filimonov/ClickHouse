\* Sabotage: the reclaim opens writes on its earlier decision; an interference
\* report between the decision and the open loses => MUST VIOLATE TerminalAbsorbing.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = TRUE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = FALSE
  StopOnce = TRUE
  MaxGen = 2
INVARIANT TypeOK
PROPERTY TerminalAbsorbing
CHECK_DEADLOCK FALSE
