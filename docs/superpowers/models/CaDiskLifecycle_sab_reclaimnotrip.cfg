\* Sabotage: a reclaim's step 0 only moves Live to Transient and leaves the
\* fence as it is. A request raised during a reclaim is overridden by that
\* reclaim's arm, and the next reclaim runs Transient on an armed fence
\* => MUST VIOLATE I4aTransientImpliesLost.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = FALSE
  MaxGen = 2
INVARIANT TypeOK
INVARIANT I4aTransientImpliesLost
CHECK_DEADLOCK FALSE
