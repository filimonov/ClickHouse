  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = FALSE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = FALSE
  LossStops = FALSE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  ReacquireInThread = FALSE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
  DrainWaitsPublish = TRUE
  FarewellLeaseBound = FALSE
  SabFarewellFromTerminal = FALSE
INVARIANT TypeOK
INVARIANT I4aTransientImpliesLost
CHECK_DEADLOCK FALSE
