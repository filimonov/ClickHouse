\* Sabotage: a reclaim's step 0 only moves Live to Transient and leaves the
\* fence as it is => MUST VIOLATE I4aTransientImpliesLost.
\* LossStops = FALSE: the race needs an interference report that requests a
\* remount, which only the product before Stopping makes.
SPECIFICATION Spec
