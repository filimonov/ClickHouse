\* Positive gate with the reacquire in the lease thread: an own fenced body (R8) closes the old epoch,
\* allocates one epoch per fence, claims and opens writes; an operation admitted under the old epoch is
\* refused. Every invariant and property MUST HOLD under FairSpec.
SPECIFICATION FairSpec
CONSTANTS
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  ArmChecksTerminal = TRUE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
  DrainWaitsPublish = TRUE
  FarewellLeaseBound = FALSE
  SabFarewellFromTerminal = FALSE
INVARIANT TypeOK
INVARIANT I1ForgetTerminal
INVARIANT I1bForgetWinsUnlessNatural
INVARIANT I2EarnedFarewell
INVARIANT I3OneWay
INVARIANT NoFarewellOnStopping
INVARIANT NoLandingAfterFarewell
INVARIANT NoFarewellAfterUnclearRenewal
INVARIANT I4bTerminalImpliesLost
INVARIANT I6GcStoppedAfterForget
INVARIANT I8RenewsActiveRenewer
INVARIANT NoJoinWindowReclaim
INVARIANT I9LossTerminates
INVARIANT OneProcessStop
INVARIANT StopFollowsLatch
INVARIANT ClosedRequestsNoStop
INVARIANT I4cReacquiringImpliesLost
INVARIANT OneAllocationPerFence
INVARIANT OldEpochOpRefused
PROPERTY RenewNotAfterIntent
PROPERTY LiveOnlyWhenAdmissible
PROPERTY TerminalAbsorbing
PROPERTY NoArmAfterLatch
PROPERTY ForgetWinsArm
PROPERTY PauseKeepsEpoch
PROPERTY ForgetCompletes
PROPERTY GcExitsAfterTerminal
PROPERTY LeaseThreadExits
