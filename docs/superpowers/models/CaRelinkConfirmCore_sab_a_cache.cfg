\* SABOTAGE fix A: reuse a slot observation that completed BEFORE the snapshot (single-flight
\* joining an older GET).  TLC MUST violate ConfirmedRelinkNeverDangles.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
    ZombieBelief = TRUE
    AllowTwin = TRUE
    ConfirmFix = "A"
    MaxRenew = 1
    SabotageSlotCache = TRUE
    SabotageHolderOnly = FALSE
    SabotageRenewBeforeCheck = FALSE
INVARIANTS
    TypeOK
    GraduationIsPhased
    ConfirmedRelinkNeverDangles
    PromotedNeverDangles
CHECK_DEADLOCK FALSE
