\* SABOTAGE (equal epoch): a start overwrites another incarnation's live body of the same
\* (uuid, epoch). Uuid A has two incarnations. One allocates epoch 1 and claims; the other resolves an
\* ambiguous allocation by reading the counter (`AllocResolvedByRead`) and also holds 1; it then
\* takes `claimMount`'s "own claim replayed" refresh branch over the first one's body.
\* `SabRefreshOwnPair = TRUE` keeps that branch. Expected: `ClaimNeverRegressesEpoch` violated.
\* Bounds and constraints as `_twins`.
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 3
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = TRUE
    MaxAdmissions = 0
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT ClaimNeverRegressesEpoch
