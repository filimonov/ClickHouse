\* Sabotage: a reclaim with a too-old claim arms the fence and reports Live at
\* once, without the renewal => MUST VIOLATE LiveOnlyWhenAdmissible.
\* The same sabotage on the reacquire in the lease thread (`ReacquireInThread`); the route must be red on the
\* same property.
SPECIFICATION Spec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = TRUE
  RenewChecksIntent = TRUE
  ReadinessGate = FALSE
  LiveChecksPending = TRUE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  LossStops = TRUE
  RenewOkChecksLatch = TRUE
  ArmRechecksAtOpen = TRUE
  StopOnce = TRUE
  SabFarewellOnStopping = FALSE
  ReacquireInThread = TRUE
  SabReacqAllocPerAttempt = FALSE
  SabOldOpUnchecked = FALSE
  SabLossReacquires = FALSE
  MaxGen = 2
INVARIANT TypeOK
PROPERTY LiveOnlyWhenAdmissible
CHECK_DEADLOCK FALSE
