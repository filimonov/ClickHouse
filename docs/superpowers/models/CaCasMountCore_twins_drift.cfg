\* POSITIVE gate: `_twins` with `Drift = 1`. A same-uuid replacement on observed death waits
\* `mount.deadline + Drift <= clock`, because the replaced body may belong to a live twin whose
\* `fenceUntil` outlives the stamp by up to `Drift`. With the bare `mount.deadline <= clock` this
\* config violates `OneWritableIncarnationPerUuid` in seven steps (see the 2026-10-08 section of
\* `CaCasMountCore_RESULTS.md`).
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 3
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 1
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
    ImmutableAlloc = FALSE
    SabReacquireRedecides = FALSE
    StragglerAdopt = FALSE
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT NoPermanentWedge
INVARIANT ClaimNeverRegressesEpoch
INVARIANT OneWritableIncarnationPerUuid
