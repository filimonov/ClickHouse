\* Positive gate with the reacquire in the lease thread: an own fenced body (R8) closes the old epoch,
\* allocates one epoch per fence, claims and opens writes; an operation admitted under the old epoch is
\* refused. Every invariant and property MUST HOLD under FairSpec2.
