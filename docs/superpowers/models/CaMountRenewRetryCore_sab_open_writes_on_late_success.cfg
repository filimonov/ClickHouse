\* Sabotage: `OpenWrites` ignores the deadline, so a late success opens writes. EXPECTED: `LateSuccessNeverOpensWrites` violated.
SPECIFICATION Spec
CONSTANTS
    AttemptIds = {attempt1, attempt2, attempt3}
    FirstAttempt = attempt1
    SecondAttempt = attempt2
    OtherAttempt = attempt3
    Holders = {self, foreign}
    SelfHolder = self
    ForeignHolder = foreign
    PredecessorToken = predecessor
    FirstRenewalToken = renewal1
    SecondRenewalToken = renewal2
    TwinToken = twin
    SuccessorToken = successor
    ForeignToken = foreignToken
    InitialConfirmedDeadline = 3
    MaxTime = 5
    LeaseDuration = 4
    CadencePeriod = 2
    MaxRetries = 1
    MaxOutstanding = 2
    MaxEngineCalls = 1
    Defects = {"open_writes_on_late_success"}
INVARIANTS TypeOK LateSuccessNeverOpensWrites
CHECK_DEADLOCK FALSE
