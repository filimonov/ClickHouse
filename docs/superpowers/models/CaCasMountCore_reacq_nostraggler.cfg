\* POSITIVE gate on the straggler wrapper: no adopt write lands while a reacquire holds the fence latched.
\* Expected: green. Runs `CaCasMountCoreStraggler.tla`. Two incarnations of one uuid, `TTL = 1`, `Reserve =
\* 0`, `MaxClock = 2`, `MaxEpoch = 3`, `MaxToken = 6`, `CertReacquire` and `FarewellOn` on (immutable
\* allocation and claim as `_twins_immclaim`).
\* `VIEW` drops seven variables nothing here reads (see `ViewNoHistory`) and the wrapper's `stragglerLanded`.
SPECIFICATION SpecW
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 3
    MaxToken = 6
    TTL = 1
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
    ImmutableAlloc = TRUE
    SabReacquireRedecides = FALSE
    ImmutableClaim = TRUE
    Reserve = 0
    SabClaimDeadlineAtConfirm = FALSE
    SabOpenWithoutReserve = FALSE
    SabClaimResolveByPair = FALSE
    TwoStepAbsence = FALSE
    ProxyMay404 = FALSE
    SabAbsenceGetOnly = FALSE
    CertReacquire = TRUE
    FarewellOn = TRUE
    SabReacqAnyFenced = FALSE
    SabReacqClean = FALSE
    SabReacqUnknownPair = FALSE
    SabReacqForgetsStep = FALSE
