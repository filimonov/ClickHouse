\* SABOTAGE: a reacquire that saw another process move the counter re-decides like a start instead of
\* stopping (`SabReacquireRedecides = TRUE`). A fenced incarnation's allocation is refused cleanly after
\* its twin's; it allocates again and reclaims its own fenced body. Expected:
\* `ReacquireStopsOnForeignAdvance` violated. Bounds and constraints as `_twins`.
SPECIFICATION Spec
CONSTANTS
    Actors = {A}
    None = NoneVal
    MaxClock = 3
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    TwinUuids = {A}
    SabClaimNonMonotone = FALSE
    SabRefreshOwnPair = FALSE
    MaxAdmissions = 0
    ImmutableAlloc = TRUE
    SabReacquireRedecides = TRUE
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
CONSTRAINT NoEpochWipe
INVARIANT TypeOK
INVARIANT ReacquireStopsOnForeignAdvance
